 como en prepa.", "Porque me da risa pensar que algún día podríamos estar en una junta bien formal y tener que evitar mirarnos para no reírnos.", "Porque quiero estar ahí para aplaudirte en los días en que todo tu esfuerzo dé frutos.", "Porque también quiero acompañarte en esos días en que nomás necesitas que alguien te diga: ya, ven, cuéntame", "Porque tu cariño me ha hecho sentir muy querida.", "Porque contigo me siento en confianza hasta cuando no sé cómo empezar a explicar lo que siento.", "Porque me gusta que contigo puedo emocionarme un montón por algo chiquito( como cuando te gustó que te regalara una piña)", "Porque me nace contarte mis buenas noticias para emocionarnos juntas.", "Porque tu felicidad me da felicidad a mí también.", "Porque hasta cuando andamos ocupadas me encuentro cosas y pienso en ti.", "Porque una de esas cosas fue un pug y mi primer pensamiento fue , Nanoyul necesita verlo con bata.", "Porque me salió hacerte una página entera solo para decirte lo mucho que te amo. Muy discreta yo XD .", "Porque hasta escribirte esto me hace extrañarte más.", "Porque ya quiero volver a reírme contigo en persona.", "Porque me encanta que me conozcas desde una versión tan chavita de mí.", "Porque me da mucho gusto haber conocido también a esa versión de ti.", "Porque todavía me importa tanto saber cómo estás como cuando nos conocimos.", "Porque me gusta que hasta tu apodo me da ternura. Nanoyul es demasiado bonito.", "Porque te admiro un buen por quien eres ahorita y me emociona conocerte en todas tus etapas.", "Porque tenerte de amiga me ha hecho querer cuidar más a la gente que quiero, como tú me has cuidado a mí.", "Porque de todas las cosas que me dejó esa etapa de mi vida, una de mis favoritas fue conocerte.", "Porque eres una de mis mejores amigas y me siento muy afortunada de poder decírtelo.", "Porque nunca quisiste cambiar algo de mí y me amaste tal y como era <3"];
const byId = id => document.getElementById(id);
let page = 0;
let card = 0;
function showMessage() {
  byId('message').textContent = welcome[page];
  byId('advance').textContent = page === welcome.length - 1 ? 'Abrir mi regalito' : 'Seguir leyendo';
}
function showCard() {
  byId('count').textContent = `Razón ${card + 1} de ${reasons.length}`;
  byId('reason').textContent = reasons[card];
  byId('photo').hidden = card !== 33;
  byId('previous').hidden = card === 0;
  byId('next').textContent = card === reasons.length - 1 ? 'Volver al inicio ↻' : 'Siguiente →';
}
byId('advance').onclick = () => {
  if (page + 1 < welcome.length) {
    page += 1;
    showMessage();
    return;
  }
  byId('intro').hidden = true;
  byId('reveal').hidden = false;
  byId('reveal-title').focus();
};
byId('start').onclick = () => {
  byId('reveal').hidden = true;
  byId('cards').hidden = false;
  showCard();
  byId('count').focus();
};
byId('previous').onclick = () => {
  card -= 1;
  showCard();
  if (card === 0) byId('next').focus();
};
byId('next').onclick = () => {
  if (card + 1 < reasons.length) {
    card += 1;
    showCard();
    return;
  }
  card = 0;
  page = 0;
  byId('cards').hidden = true;
  byId('intro').hidden = false;
  showMessage();
  byId('advance').focus();
};
showMessage();
</script>
</html>
